services:
  postgres:
    image: postgres:15-alpine
    container_name: bankify-postgres
    restart: always
    environment:
      POSTGRES_DB: bankify
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bankify"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bankify-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      RDB_URL: jdbc:postgresql://postgres:5432/bankify
      RDB_USERNAME: postgres
      RDB_PASSWORD: root
      CURRENCY_API_KEY: cur_live_KP1yLSTdR2iuvhxnGUOvQ2ZRSsDzMIDkkilMSeUB
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bankify-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgres_data:
